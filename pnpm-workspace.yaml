packages:
  - packages/*
  - tests/*

catalogMode: prefer

# Pinned to The Current's catalog exactly; a drift here forks Effect's types for every consumer.
catalog:
  effect: 4.0.0-rc.118
  "@effect/vitest": 4.0.0-rc.118
  "@effect/platform-node": 4.0.0-rc.118
  "@types/node": 25.6.2
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1

overrides:
  "@effect/platform-node-shared": 4.0.0-rc.118
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
onlyBuiltDependencies:
  - esbuild
