packages:
  - packages/*
  - tests/*

catalogMode: prefer

# Pinned exactly and in step with The Current's catalog; a drift forks Effect's types for every consumer of the vendored kernel.
catalog:
  effect: 4.0.2
  "@effect/vitest": 4.0.2
  "@effect/platform-node": 4.0.2
  "@effect/sql-sqlite-node": 4.0.2
  "@types/node": 25.6.2
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1

overrides:
  "@effect/platform-node-shared": 4.0.2
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
onlyBuiltDependencies:
  - esbuild
